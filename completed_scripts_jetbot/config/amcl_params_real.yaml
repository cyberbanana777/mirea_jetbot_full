# AMCL для реального jetbot_mirea — ROS 2 Humble.
# Пересобран 29.10.2026: одометрия только по энкодерам (без IMU), курс копит ошибку,
# поэтому шумы модели движения подняты; нагрузка снижена.
/amcl:
  ros__parameters:
    # 1. Фреймы
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    tf_broadcast: true

    # 2. Топики и QoS
    map_topic: map
    scan_topic: scan_filtered                   # без компьютера сзади
    qos_overrides:
      /tf:
        publisher:
          depth: 100
          durability: volatile
          history: keep_last
          reliability: reliable

    use_sim_time: false

    # 3. Начальная поза (оставлена как была; при другом старте задавать 2D Pose Estimate в rviz)
    set_initial_pose: true
    initial_pose:
      x: -1.5
      y: 0.2
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false
    first_map_only: false
    transform_tolerance: 0.5
    save_pose_rate: 0.5

    # 4. Модель движения. Было 0.05 — AMCL почти слепо верил одометрии.
    #    alpha1: ошибка поворота от поворота (курс по энкодерам ненадёжен) — больше всех
    #    alpha2: ошибка поворота от пробега
    #    alpha3: ошибка пробега от пробега
    #    alpha4: ошибка пробега от поворота
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.3
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

    # 5. Модель лазера (likelihood_field)
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0
    laser_min_range: 0.15                       # ближняя граница RPLidar A2
    laser_likelihood_max_dist: 2.0
    z_hit: 0.5
    z_rand: 0.4
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.2
    max_beams: 60
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # 6. Фильтр частиц (было 8000/500 и обновление каждые 2 см / 0.02 рад — тяжело)
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.05                          # м
    update_min_a: 0.1                           # рад (~6°)
    resample_interval: 1

    # 7. Восстановление при потере (случайные частицы). Выключено явно:
    #    раньше было 0.1 / 0.1 — при равных значениях оно и так не работает.
    #    Включать для «похищенного робота»: fast 0.1, slow 0.001.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
