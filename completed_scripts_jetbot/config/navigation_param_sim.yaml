# Nav2 для СИМУЛЯЦИИ jetbot_mirea (Gazebo) — ROS 2 Humble.
# Собран 30.10.2026 из navigation_param_real.yaml: те же скорости, допуски и footprint,
# чтобы робот в симуляции вёл себя так же, как реальный. Отличия от real:
#   * use_sim_time: true во всех узлах;
#   * больше ничего — пределы реального робота сохранены намеренно.
#
# Исходные данные (как у реального робота):
#   база колёс 0.117 м (в Gazebo-плагине wheel_separation 0.12) -> B/2 ~ 0.0585 м
#   условие «колёса не насыщаются» (у реального):  v + |w| * 0.0585 <= 0.40
#     v_max = 0.25, w_max = 2.0  ->  0.367 м/с
#   footprint по URDF: x[-0.08; 0.11] (лидар спереди), y ±0.075
#   скан для карт и AMCL — /scan_filtered.
#   ВАЖНО: в симуляции lidar_filter сам не запускается (его поднимает только
#   jetbot_sensors_and_motors.launch.py для реального робота). Запускать отдельно:
#     ros2 launch lidar_filter filter.launch.py      (use_sim_time там по умолчанию True)
#
# Параметры Iron/Jazzy из старого sim-конфига (navigators, docking_server, collision_monitor
# и др.) убраны: Humble их игнорирует.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Своё дерево поведения не задано -> стандартное navigate_to_pose_w_replanning_and_recovery.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # «Застрял», только если за 15 с не сдвинулся на 15 см
    # (было по умолчанию 0.5 м за 10 с — ложные срабатывания при медленном подъезде и доворотах)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0

    # Допуски цели. От xy_goal_tolerance зависит, где RPP начнёт доворот на месте.
    # yaw 0.2 рад (~11°): за такт при 1.3 рад/с и 20 Гц поворот 0.065 рад — запас от «ловли» угла.
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true            # позиция, достигнутая один раз, не перепроверяется во время доворота
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- скорость ---
      desired_linear_vel: 0.25                  # см. условие насыщения колёс
      max_angular_accel: 2.5                    # = velocity_smoother

      # --- точка предвидения: lookahead = v * lookahead_time, в пределах [min; max] ---
      use_velocity_scaled_lookahead_dist: true
      lookahead_dist: 0.3
      lookahead_time: 1.5
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      transform_tolerance: 0.2

      # --- разворот на месте: в начале пути и ДОВОРОТ К КУРСУ ЦЕЛИ в конце ---
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.3        # >= 1.0 (трение покоя на месте), <= 2.0 (smoother)
      rotate_to_heading_min_angle: 0.6          # рад: путь сзади сильнее этого -> сначала разворот
      allow_reversing: false                    # несовместим с use_rotate_to_heading

      # --- подъезд к цели: не тормозить ниже трения покоя ---
      min_approach_linear_velocity: 0.07
      approach_velocity_scaling_dist: 0.4

      # --- замедление на поворотах и у препятствий ---
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5  # ниже этого радиуса кривизны — замедляемся
      regulated_linear_scaling_min_speed: 0.08  # но не ниже трения покоя
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.2                    # <= inflation_radius
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0        # = cost_scaling_factor в costmap

      # --- проверка столкновений по пути до точки предвидения ---
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.03
      footprint: "[[0.11, 0.075], [0.11, -0.075], [-0.08, -0.075], [-0.08, 0.075]]"
      footprint_padding: 0.01
      # 2D-лидар: ObstacleLayer вместо VoxelLayer (то же самое, но меньше CPU)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.25                  # путь держится подальше от стен
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.11, 0.075], [0.11, -0.075], [-0.08, -0.075], [-0.08, 0.075]]"
      footprint_padding: 0.01
      resolution: 0.02                          # = разрешению map.yaml (static_layer всё равно подгоняет под карту)
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.25
      always_send_full_costmap: true

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw            # имена параметров Humble
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    # разворот на месте при восстановлении: не ниже трения покоя (~1.0), без рывков
    max_rotational_vel: 1.5
    min_rotational_vel: 1.1
    rotational_acc_lim: 2.5

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200              # мс

# В Humble navigation_launch.py запускает сглаживатель ВСЕГДА:
# controller -> cmd_vel_nav -> velocity_smoother -> cmd_vel -> diff-drive плагин Gazebo.
# Именно здесь стоят реальные пределы скорости робота.
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: true                      # при ограничении ускорения сохранять кривизну
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 2.0]              # 0.25 + 2.0 * 0.0585 = 0.367 <= 0.40
    min_velocity: [-0.15, 0.0, -2.0]
    max_accel: [0.5, 0.0, 2.5]                  # отклик колёс (LADRC, t90 ~0.3 с)
    max_decel: [-0.8, 0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    # Мёртвая зона ТОЛЬКО по линейной: по угловой она обнулила бы мелкие подруливания на ходу.
    deadband_velocity: [0.03, 0.0, 0.0]
    velocity_timeout: 1.0
